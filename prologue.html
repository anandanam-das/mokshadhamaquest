<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пролог — MOKSHA Quest</title>
    <meta name="description" content="История Шивы и Васту Пуруши — пролог MOKSHA Quest." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="pixel-overlay"></div>

    <main class="auth-main">
      <section class="section prologue-section">
        <div class="prologue-stage">
          <div class="prologue-scene" id="prologueScene">
            <div class="prologue-backdrop"></div>
            <div class="prologue-sun"></div>
            <div class="prologue-cloud prologue-cloud-1"></div>
            <div class="prologue-cloud prologue-cloud-2"></div>
            <div class="prologue-cloud prologue-cloud-3"></div>
            <div class="prologue-cloud prologue-cloud-4"></div>
            <div class="prologue-cloud prologue-cloud-5"></div>
            <div class="prologue-ground"></div>
            <div class="prologue-glow"></div>
            <div class="prologue-clash-spark"></div>
            <img class="prologue-character prologue-character-shiva" id="prologueCharShiva" alt="Шива" />
            <img class="prologue-character prologue-character-demon" id="prologueCharDemon" alt="Андхакасура" />
            <img class="prologue-character prologue-character-vastu" id="prologueCharVastu" alt="Васту Пуруша" />
          </div>

          <div class="prologue-card">
            <p class="prologue-text" id="prologueText"></p>
          </div>

          <div class="prologue-controls">
            <div class="prologue-dots" id="prologueDots"></div>
            <button id="prologueNextBtn" type="button" class="btn btn-primary">Далее</button>
          </div>
        </div>
      </section>
    </main>

    <script src="state.js"></script>
    <script src="prologue.js"></script>
  </body>
</html>
