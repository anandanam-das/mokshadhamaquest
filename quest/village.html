<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обитель богов — MOKSHA Quest</title>
    <meta name="description" content="Карта обители богов MOKSHA Quest: мандала из девяти зданий вокруг Ратуши." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="pixel-overlay"></div>

    <header class="app-nav">
      <nav class="nav">
        <div class="nav-links">
          <a href="profile.html" class="btn btn-secondary nav-profile" aria-label="Личный кабинет">👤 Кабинет</a>
          <button id="logoutBtn" type="button" class="btn btn-secondary nav-logout">Выйти</button>
        </div>
      </nav>
    </header>

    <main>
      <section id="village" class="section village-section">
        <div class="section-heading">
          <h2>MOKSHA DHAMA QUEST</h2>
          <p class="section-subheading">Освободи Васту Пурушу — открывай здания, проходя уроки</p>
        </div>

        <div class="village-layout">
          <div class="village-stage-wrap" id="villageStageWrap">
            <div class="village-stage" id="villageStage"></div>
          </div>
          <aside class="course-detail-panel" id="villageDetail"></aside>
        </div>

        <div class="task-content-row">
          <div class="task-content-panel" id="taskContentPanel"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© MOKSHA Quest. Доброе обучение как игра.</p>
    </footer>

    <div class="patron-widget" id="patronWidget">
      <button type="button" class="patron-widget-hide" id="patronWidgetHideBtn" aria-label="Скрыть помощника">×</button>
      <div class="speech-bubble" id="patronSpeechBubble" hidden></div>
      <img id="patronWidgetImage" class="patron-widget-image" src="" alt="" />
    </div>

    <button type="button" class="patron-widget-reopen" id="patronWidgetReopenBtn" hidden aria-label="Показать помощника">
      <img id="patronReopenImage" class="patron-widget-reopen-image" src="" alt="" />
    </button>

    <!-- Плавающая кнопка "Экзамен Шивы" — вне карты, вне .village-layout,
         поэтому никак не зависит от того, рассеялись ли на карте облака.
         Появляется/скрывается через village.js (updateShivaExamBadge). -->
    <button type="button" class="shiva-exam-badge" id="shivaExamBadge" hidden aria-label="Экзамен Шивы">
      <img class="shiva-exam-badge-image" src="assets/prologue/shiva.png" alt="" />
      <span class="shiva-exam-badge-label">Экзамен Шивы</span>
    </button>

    <script src="state.js"></script>
    <script src="src/config.js"></script>
    <script src="questApi.js"></script>
    <script src="characters.js"></script>
    <script src="buildings.js"></script>
    <script src="lessons.js"></script>
    <script src="taskContent.js"></script>
    <script src="planetTaskContent.js"></script>
    <script src="relationshipsTaskContent.js"></script>
    <script src="reactions.js"></script>
    <script src="reactionsExpanded.js"></script>
    <script src="village.js"></script>
    <script src="nav.js"></script>
  </body>
</html>
