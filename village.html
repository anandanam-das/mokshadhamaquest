<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Деревня знания — MOKSHA Quest</title>
    <meta name="description" content="Карта деревни MOKSHA Quest: мандала из девяти зданий вокруг Ратуши." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="pixel-overlay"></div>

    <header class="app-nav">
      <nav class="nav">
        <div class="brand">MOKSHA QUEST</div>
        <div class="nav-links">
          <button id="logoutBtn" type="button" class="btn btn-secondary nav-logout">Выйти</button>
        </div>
      </nav>
    </header>

    <main>
      <section id="village" class="section village-section">
        <div class="section-heading">
          <p class="eyebrow">Деревня знания</p>
          <h2>Тело Васту Пуруши</h2>
          <p class="section-subheading">Открывай здания, проходя уроки</p>
        </div>

        <div class="village-layout">
          <div class="village-stage" id="villageStage"></div>
          <aside class="course-detail-panel" id="villageDetail"></aside>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© MOKSHA Quest. Доброе обучение как игра.</p>
    </footer>

    <div class="onboarding-overlay" id="onboardingOverlay" hidden>
      <div class="onboarding-tooltip" id="onboardingTooltip">
        <p class="onboarding-text" id="onboardingText"></p>
        <button type="button" class="btn btn-primary onboarding-next" id="onboardingNextBtn">Далее</button>
      </div>
    </div>

    <script src="state.js"></script>
    <script src="characters.js"></script>
    <script src="buildings.js"></script>
    <script src="lessons.js"></script>
    <script src="village.js"></script>
    <script src="nav.js"></script>
  </body>
</html>
